<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Prompts | Prompt Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #e5e5e5; 
            font-family: 'Inter', sans-serif; 
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(6, 182, 212, 0.3); 
            box-shadow: 0 20px 40px -10px rgba(6, 182, 212, 0.1);
        }

        /* Custom Scrollbar for the Prompt Text Area */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.3); /* Cyan tint */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.8);
        }

        .copy-toast {
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #06b6d4; 
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.4);
            z-index: 50;
        }

        .show-toast { 
            visibility: visible; 
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, fadeOut 0.4s 2.5s forwards; 
        }

        @keyframes slideUpFade { 
            from { bottom: 10px; opacity: 0; } 
            to { bottom: 30px; opacity: 1; } 
        }
        @keyframes fadeOut { 
            from { opacity: 1; } 
            to { opacity: 0; visibility: hidden; } 
        }

        .line-clamp-4 {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen flex flex-col">
    
    <header class="max-w-7xl mx-auto mb-16 w-full text-center">
        <h1 class="text-4xl md:text-5xl font-light tracking-tight text-white mb-3">
            fine<span class="font-semibold text-cyan-400">prompts</span>
        </h1>
        <p class="text-gray-400 font-light tracking-wide">MY PERSONAL PRIVATE PROMPT VAULT</p>
    </header>

    <main id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-7xl mx-auto w-full flex-grow">
        </main>

    <div id="toast" class="copy-toast">Prompt Copied!</div>

    <script src="script.js"></script>
</body>
</html>
